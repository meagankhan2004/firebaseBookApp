<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Book App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

  <nav class="blue">
    <div class="nav-wrapper container">
      <a class="brand-logo">BookApp</a>
      <ul id="nav-mobile" class="right">
        <span id="user" class="white-text"></span>
        <a id="loginBtn" class="btn white blue-text">Login</a>
        <a id="logoutBtn" class="btn white blue-text" style="display:none;">Logout</a>
      </ul>
    </div>
  </nav>

  <div class="container" style="margin-top:20px;">

    <div class="row" id="bookList"></div>

    <div class="row">
      <h5 id="selectedName">No book selected</h5>
      <form id="reviewForm">
        <input type="hidden" id="selectedBook" name="isbn" value="null">
        <div class="input-field">
          <textarea id="text" name="text" class="materialize-textarea" required></textarea>
          <label for="text">Write a Review</label>
        </div>
        <button type="submit" class="btn blue waves-effect waves-light">Submit Review</button>
      </form>
    </div>

    <div class="row" id="reviewList"></div>

  </div>

  <script type="module">
    import { signIn, logout, auth, setAuthListeners } from './auth.js';
    import { getBooks, getReviews, createReview, deleteReview } from './data.js';

    let loginBtn = document.querySelector('#loginBtn');
    let logoutBtn = document.querySelector('#logoutBtn');
    let reviewForm = document.querySelector('#reviewForm');

    function setLoggedInUI() {
      M.toast({ html: 'Logged In!' });
      document.querySelector('#user').innerHTML = 'Signed in Anonymously';
      loginBtn.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
    }

    function setLoggedOutUI() {
      M.toast({ html: 'Logged Out!' });
      document.querySelector('#user').innerHTML = '';
      loginBtn.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }

    function renderBooks(books) {
      let html = '';
      books.forEach((book) => {
        html += `
          <div class="col s12 m4">
            <div class="card">
              <div class="card-image">
                <img src="${book.cover}" alt="${book.title}">
              </div>
              <div class="card-content">
                <span class="card-title">${book.title}</span>
                <p>${book.author}</p>
              </div>
              <div class="card-action">
                <a class="btn blue" onclick="window.selectBook('${book.isbn}', '${book.title}')">Reviews</a>
              </div>
            </div>
          </div>`;
      });
      document.querySelector('#bookList').innerHTML = html;
    }

    function renderReviews(reviews) {
      let html = '';
      if (reviews.length === 0) {
        html = '<p>No reviews yet. Be the first!</p>';
      }
      reviews.forEach((review) => {
        html += `
          <div class="card-panel">
            <p>${review.text}</p>
            <small>By: ${review.author}</small>
            <a class="btn red btn-small right" onclick="window.removeReview('${review.id}', '${review.isbn}')">Delete</a>
          </div>`;
      });
      document.querySelector('#reviewList').innerHTML = html;
    }

    window.selectBook = function(isbn, name) {
      document.querySelector('#selectedName').innerHTML = name;
      document.querySelector('#selectedBook').value = isbn;
      getReviews(isbn, renderReviews);
    }

    window.removeReview = async function(id, isbn) {
      await deleteReview(id);
      getReviews(isbn, renderReviews);
    }

    async function submitReview(event) {
      event.preventDefault();
      let form = event.target;
      let formData = new FormData(form);
      const { text, isbn } = Object.fromEntries(formData);

      if (isbn === 'null') {
        alert('Please select a book to review');
      } else if (auth.currentUser === null) {
        alert('Please login to review');
      } else {
        await createReview(auth, isbn, text);
        M.toast({ html: 'Review created!' });
        form.reset();
        getReviews(isbn, renderReviews);
      }
    }

    loginBtn.addEventListener('click', signIn);
    logoutBtn.addEventListener('click', logout);
    reviewForm.addEventListener('submit', submitReview);
    setAuthListeners(setLoggedInUI, setLoggedOutUI);

    // Load books on page load
    getBooks().then(renderBooks);
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
